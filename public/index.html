<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Imperial Academy Management System" />
    
    <!-- PWA 관련 태그 -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <title>Imperial System</title>
    
    <!-- Tailwind CSS는 이제 빌드 시점에 생성됩니다.
         설정: /tailwind.config.js,  진입점: /src/style.css
         예전에는 여기서 cdn.tailwindcss.com 을 불러왔는데, 그 방식은 접속할 때마다
         브라우저가 CSS를 만들어야 해서 첫 화면이 느렸습니다. -->

    <!-- Pretendard Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    
    <style>
      /* 기본 설정 */
      body { font-family: 'Pretendard', sans-serif !important; margin: 0; padding: 0; background-color: #ffffff; }
      
      /* 스크롤바 커스텀 */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      button { min-height: 48px; touch-action: manipulation; }

      /* --- [로딩 화면 스타일] ---
         ⚠️ 예전에는 아래 flex 가운데정렬을 #root 에 직접 걸었습니다.
            그런데 이 규칙은 React 가 앱을 그린 뒤에도 계속 살아 있습니다.
            align-items:center 는 자식을 '화면 폭에 맞춰 늘리지 않고 내용 크기로' 두기
            때문에, 내용이 화면보다 조금이라도 넓어지면 그대로 삐져나가고
            overflow-hidden 에 잘립니다. 모바일에서 여러 메뉴의 오른쪽이 잘려 보이던
            원인이 이것이었습니다.
            가운데정렬은 로딩 화면 자신에게만 주고, #root 는 평범한 전체폭 블록으로 둡니다. */
      #root {
        min-height: 100vh;
        width: 100%;
        max-width: 100%;
      }

      .loading-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
        margin: 0 auto;
        max-width: 80%;
      }

      /* 텍스트 기본 스타일 (처음엔 안 보임) */
      .loading-text {
        opacity: 0;
        transform: translateY(10px);
        animation: fadeInUp 0.8s ease-out forwards;
      }

      /* 1. 접속 중입니다... (즉시 등장) */
      .text-step-1 {
        font-size: 1.2rem;
        font-weight: 700;
        color: #111827;
        margin-bottom: 15px;
        animation-delay: 0.2s;
      }

      /* 2. 로딩 지연 안내 (1.5초 뒤 등장) */
      .text-step-2 {
        font-size: 0.95rem;
        color: #6b7280;
        margin-bottom: 5px;
        animation-delay: 1.5s;
        line-height: 1.5;
      }

      /* 3. 전화번호 (2.5초 뒤 등장) */
      .text-step-3 {
        font-size: 1.1rem;
        font-weight: 800;
        color: #2563eb;
        animation-delay: 2.5s;
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- React가 로드되기 전까지 이 내용이 보여집니다. -->
    <div id="root">
      <div class="loading-container">
        <!-- 순차적으로 뜨는 텍스트 -->
        <div class="loading-text text-step-1">
          임페리얼 시스템에 접속중입니다...
        </div>
        <div class="loading-text text-step-2">
          로딩이 불가능할 시에는<br/>데스크에 연락 바랍니다.
        </div>
        <div class="loading-text text-step-3">
          02-2644-1178
        </div>
      </div>
    </div>
  </body>
</html>
